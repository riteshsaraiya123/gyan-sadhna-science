        { q: "પ્રજ્ઞા અભિગમમાં 'અર્લી રીડર' (Early Reader) ના વિકાસ પર કોણ ભાર મૂકે છે?", opts: ["FLN (પાયાની સાક્ષરતા)", "માત્ર ઉચ્ચ શિક્ષણ", "સ્વાસ્થ્ય વિભાગ", "રમતગમત વિભાગ"], ans: "FLN (પાયાની સાક્ષરતા)" },
        { q: "જો કોઈ વાલી શાળાની ફી ન ભરી શકે, તો RTE મુજબ શું કાર્યવાહી થાય?", opts: ["સરકારી શાળામાં ફી હોતી જ નથી (ફ્રી એજ્યુકેશન)", "બાળકને કાઢી મૂકાય", "ફી માફીનું ફોર્મ ભરાય", "પોલીસમાં ફરિયાદ થાય"], ans: "સરકારી શાળામાં ફી હોતી જ નથી (ફ્રી એજ્યુકેશન)" },
        { q: "શિક્ષણ પંચ (કોઠારી કમિશન) એ બજેટના કેટલા ટકા રકમ શિક્ષણ પર ખર્ચવાની ભલામણ કરી હતી?", opts: ["૬%", "૪%", "૧૦%", "૨%"], ans: "૬%" },
        { q: "આચાર્ય તરીકે તમારી સૌથી મોટી જવાબદારી કઈ છે?", opts: ["બાળકોને ગુણવત્તાયુક્ત શિક્ષણ મળે તે સુનિશ્ચિત કરવું", "માત્ર કાગળ પર કામ કરવું", "માત્ર મીટીંગો કરવી", "ફંડ બચાવવું"], ans: "બાળકોને ગુણવત્તાયુક્ત શિક્ષણ મળે તે સુનિશ્ચિત કરવું" }
    ];

    const formContainer = document.getElementById("questions-container");

    // વિકલ્પોને રેન્ડમ (આગળ-પાછળ) કરવા માટેનું ફંક્શન
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    quizData.forEach((qObj, index) => {
        const qNum = index + 1;
        let optionsHTML = "";
        
        // વિકલ્પોને શફલ (રેન્ડમ) કરો
        let randomizedOptions = shuffleArray(qObj.opts);
        
        randomizedOptions.forEach((opt) => {
            optionsHTML += `<label><input type="radio" name="q${qNum}" value="${opt}"> ${opt}</label>`;
        });

        const qHTML = `
            <div class="question-box" data-qname="q${qNum}" data-correct-ans="${qObj.ans}">
                <div class="question-title">${qNum}. ${qObj.q}</div>
                <div class="options">${optionsHTML}</div>
            </div>
        `;
        formContainer.innerHTML += qHTML;
    });

    function checkScore() {
        let score = 0;
        let total = quizData.length;
        let incorrectSummary = "";
        
        let boxes = document.querySelectorAll('.question-box');
        
        boxes.forEach((box, index) => {
            let qNum = index + 1;
            let correctAns = box.getAttribute('data-correct-ans');
            let selectedInput = box.querySelector(`input[name="q${qNum}"]:checked`);
            
            let titleText = box.querySelector('.question-title').innerText;

            if (selectedInput) {
                let userAns = selectedInput.value;
                if (userAns === correctAns) {
                    score++;
                } else {
                    incorrectSummary += `<div class="summary-item"><strong>${titleText}</strong><br>❌ તમારો જવાબ: <span style="color:#c0392b;">${userAns}</span><br>✅ <b>સાચો જવાબ:</b> <span style="color:#27ae60;">${correctAns}</span></div>`;
                }
            } else {
                incorrectSummary += `<div class="summary-item"><strong>${titleText}</strong><br>❌ તમે જવાબ આપ્યો નથી.<br>✅ <b>સાચો જવાબ:</b> <span style="color:#27ae60;">${correctAns}</span></div>`;
            }
        });

        let resBox = document.getElementById('result-box');
        resBox.style.display = 'block';
        
        let htmlContent = `🎉 <b>અભિનંદન! તમારો સ્કોર: ${score} / ${total} સાચા પડ્યા છે!</b>`;
        
        if (score < total) {
            htmlContent += `<hr style="margin: 15px 0; border: 0; border-top: 1px solid #b2dfdb;"><b style="color: #c0392b;">💡 તમારા ખોટા પડેલા પ્રશ્નોના સાચા જવાબો અહીં તપાસો:</b>` + incorrectSummary;
        } else {
            htmlContent += `<br><br>🌟 અતિ ઉત્તમ! તમારી અંતિમ તૈયારી ખૂબ જ મજબૂત છે. પરીક્ષા માટે All The Best!`;
        }
        
        resBox.innerHTML = htmlContent;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
