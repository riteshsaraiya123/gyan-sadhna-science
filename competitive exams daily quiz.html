<script>
    // 100 Most Important HTAT Questions
    const quizData = [
        { q: "RTE 2009 મુજબ ધોરણ ૧ થી ૫ માં જો ૬૦ થી ઓછી સંખ્યા હોય તો કેટલા શિક્ષકો મળવાપાત્ર છે?", opts: ["૧", "૨", "૩", "૪"], ans: "૨" },
        { q: "મુંબઈ પ્રાથમિક શિક્ષણ અધિનિયમ કયા વર્ષમાં ઘડવામાં આવ્યો?", opts: ["૧૯૪૭", "૧૯૪૯", "૨૦૦૯", "૧૯૬૧"], ans: "૧૯૪૭" },
        { q: "પ્રાથમિક શાળાના શિક્ષકને પ્રાસંગિક રજા (CL) કોણ મંજૂર કરે છે?", opts: ["તાલુકા વિકાસ અધિકારી", "મુખ્ય શિક્ષક (HT)", "શાસનાધિકારી", "TPEO"], ans: "મુખ્ય શિક્ષક (HT)" },
        { q: "RTE 2009 અંતર્ગત ખાનગી શાળાઓમાં નબળા વર્ગના બાળકો માટે કેટલા ટકા અનામત બેઠકોની જોગવાઈ છે?", opts: ["૨૦%", "૨૫%", "૩૦%", "૧૫%"], ans: "૨૫%" },
        { q: "SMC (શાળા વ્યવસ્થાપન સમિતિ) માં ઓછામાં ઓછી કેટલી ટકાવારી વાલીઓની હોવી જોઈએ?", opts: ["૫૦%", "૭૫%", "૩૩%", "૧૦૦%"], ans: "૭૫%" },
        { q: "SMC ના કુલ સભ્યોમાંથી કેટલી મહિલા સભ્યો હોવી ફરજિયાત છે?", opts: ["૨૫%", "૩૩%", "૫૦%", "૭૫%"], ans: "૫૦%" },
        { q: "બાળકોના મફત અને ફરજિયાત શિક્ષણનો અધિકાર નિયમો (ગુજરાત) કયા વર્ષથી અમલમાં આવ્યા?", opts: ["૨૦૦૯", "૨૦૧૦", "૨૦૧૨", "૨૦૧૧"], ans: "૨૦૧૨" },
        { q: "પ્રાથમિક શાળાના સમયપત્રક (Time Table) તૈયાર કરવાની મુખ્ય જવાબદારી કોની છે?", opts: ["શિક્ષકોની", "મુખ્ય શિક્ષકની (HT)", "SMC ની", "TPEO ની"], ans: "મુખ્ય શિક્ષકની (HT)" },
        { q: "RTE 2009 મુજબ ધોરણ ૬ થી ૮ માં એક શૈક્ષણિક વર્ષમાં કામકાજના દિવસો કેટલા હોવા જોઈએ?", opts: ["૨૦૦", "૨૨૦", "૨૧૦", "૨૪૦"], ans: "૨૨૦" },
        { q: "RTE 2009 મુજબ ધોરણ ૧ થી ૫ માટે શૈક્ષણિક કલાકો કેટલા હોવા જોઈએ?", opts: ["૮૦૦", "૧૦૦૦", "૧૨૦૦", "૭૦૦"], ans: "૮૦૦" },
        { q: "ગુજરાત માધ્યમિક અને ઉચ્ચતર માધ્યમિક શિક્ષણ બોર્ડ (GSEB) ની સ્થાપના ક્યારે થઈ?", opts: ["૧૯૬૦", "૧૯૭૨", "૧૯૯૮", "૨૦૦૫"], ans: "૧૯૭૨" },
        { q: "ગુજરાત કાઉન્સિલ ઓફ એજ્યુકેશનલ રિસર્ચ એન્ડ ટ્રેનિંગ (GCERT) ક્યાં આવેલી છે?", opts: ["અમદાવાદ", "ગાંધીનગર", "વડોદરા", "રાજકોટ"], ans: "ગાંધીનગર" },
        { q: "DIET નું પૂરું નામ શું છે?", opts: ["District Institute of Education and Training", "District Institution of English Teachers", "Department of Indian Educational Training", "District Indian Education Team"], ans: "District Institute of Education and Training" },
        { q: "CRC નું પૂરું નામ જણાવો.", opts: ["Cluster Resource Centre", "Block Resource Centre", "City Resource Centre", "Central Resource Council"], ans: "Cluster Resource Centre" },
        { q: "RTE ની કલમ ૧૭ શેની સાથે સંબંધિત છે?", opts: ["પ્રવેશ માટે કેપિટેશન ફી પર પ્રતિબંધ", "શારીરિક શિક્ષા અને માનસિક ત્રાસ પર પ્રતિબંધ", "શિક્ષકોની લાયકાત", "શાળા વ્યવસ્થાપન સમિતિ"], ans: "શારીરિક શિક્ષા અને માનસિક ત્રાસ પર પ્રતિબંધ" },
        { q: "શિક્ષકને અડધા પગારની રજા (HPL) દર વર્ષે કેટલી જમા થાય છે?", opts: ["૧૦", "૧૫", "૨૦", "૩૦"], ans: "૨૦" },
        { q: "SMC ની રચના દર કેટલા વર્ષે કરવાની હોય છે?", opts: ["દર વર્ષે", "દર બે વર્ષે", "દર ત્રણ વર્ષે", "દર પાંચ વર્ષે"], ans: "દર બે વર્ષે" },
        { q: "આચાર્ય તરીકે કોઈ શિક્ષકની બદલી કરવાની સત્તા કોની છે?", opts: ["DPEO", "TPEO", "રાજ્ય સરકાર", "શિક્ષણ મંત્રી"], ans: "DPEO" },
        { q: "RTE કાયદા મુજબ કેટલા વર્ષના બાળકોને મફત અને ફરજિયાત શિક્ષણ આપવાનું છે?", opts: ["૬ થી ૧૪", "૫ થી ૧૫", "૬ થી ૧૮", "૩ થી ૧૪"], ans: "૬ થી ૧૪" },
        { q: "પ્રાથમિક શાળામાં મધ્યાહન ભોજન યોજના કયા વર્ષથી શરૂ થઈ?", opts: ["૧૯૮૪", "૧૯૯૫", "૨૦૦૦", "૨૦૦૫"], ans: "૧૯૯૫" },
        { q: "પ્રસૂતિની રજા (Maternity Leave) મહિલા શિક્ષકને કેટલી મળે છે?", opts: ["૧૩૫ દિવસ", "૧૮૦ દિવસ", "૯૦ દિવસ", "૬૦ દિવસ"], ans: "૧૮૦ દિવસ" },
        { q: "પિતૃત્વની રજા (Paternity Leave) પુરુષ શિક્ષકને કેટલી મળે છે?", opts: ["૧૦ દિવસ", "૧૫ દિવસ", "૨૦ દિવસ", "મળતી નથી"], ans: "૧૫ દિવસ" },
        { q: "કલમ ૨૧ (RTE) શેના વિશે છે?", opts: ["SMC ની રચના", "શિક્ષકોની ફરજો", "શાળાના ધોરણો", "ફી માફી"], ans: "SMC ની રચના" },
        { q: "ગુણોત્સવ કાર્યક્રમનો મુખ્ય હેતુ શું છે?", opts: ["શાળાની સફાઈ", "શિક્ષણની ગુણવત્તામાં સુધારો", "માત્ર શિક્ષકોનું મૂલ્યાંકન", "મધ્યાહન ભોજનની ચકાસણી"], ans: "શિક્ષણની ગુણવત્તામાં સુધારો" },
        { q: "SSA (સર્વ શિક્ષા અભિયાન) કયા વર્ષમાં શરૂ થયું?", opts: ["૧૯૯૮-૯૯", "૨૦૦૦-૦૧", "૨૦૦૫-૦૬", "૨૦૦૯-૧૦"], ans: "૨૦૦૦-૦૧" },
        { q: "ધોરણ ૧ માં પ્રવેશ માટે બાળકની ઉંમર કેટલી હોવી જોઈએ? (નવા નિયમ મુજબ)", opts: ["૫ વર્ષ પૂરા", "૬ વર્ષ પૂરા", "૫.૫ વર્ષ", "૭ વર્ષ"], ans: "૬ વર્ષ પૂરા" },
        { q: "પ્રાથમિક શિક્ષકને વર્ષમાં કેટલી પ્રાસંગિક રજા (CL) મળે છે?", opts: ["૧૨", "૧૪", "૧૫", "૨૦"], ans: "૧૫" },
        { q: "RTI (માહિતી અધિકાર) કાયદો ક્યારથી અમલમાં આવ્યો?", opts: ["૧૨ ઓક્ટોબર ૨૦૦૫", "૧૫ ઓગસ્ટ ૨૦૦૫", "૧ એપ્રિલ ૨૦૧૦", "૨૬ જાન્યુઆરી ૨૦૦૬"], ans: "૧૨ ઓક્ટોબર ૨૦૦૫" },
        { q: "RTI હેઠળ જીવન અને સ્વાતંત્ર્યને લગતી માહિતી કેટલા સમયમાં આપવાની હોય છે?", opts: ["૩૦ દિવસ", "૪૮ કલાક", "૨૪ કલાક", "૧૫ દિવસ"], ans: "૪૮ કલાક" },

        { q: "બાળકને શાળામાંથી કાઢી ન મૂકવા અને નાપાસ ન કરવા અંગેની જોગવાઈ RTE ની કઈ કલમમાં હતી? (હાલ સુધારો થયેલ છે)", opts: ["કલમ ૧૫", "કલમ ૧૬", "કલમ ૧૭", "કલમ ૩૦"], ans: "કલમ ૧૬" },

        { q: "'શિક્ષણ એ ત્રિધ્રુવીય પ્રક્રિયા છે' - આ વિધાન કોણે આપ્યું છે?", opts: ["જ્હોન ડ્યુઇ", "એડમ્સ", "ગાંધીજી", "પ્લેટો"], ans: "જ્હોન ડ્યુઇ" }
    ];

    const formContainer = document.getElementById("questions-container");

    // Render all questions
    quizData.forEach((qObj, index) => {
        const qNum = index + 1;
        let optionsHTML = "";
        
        qObj.opts.forEach((opt) => {
            optionsHTML += `<label><input type="radio" name="q${qNum}" value="${opt}"> ${opt}</label>`;
        });

        const qHTML = `
            <div class="question-box" data-qname="q${qNum}" data-correct-ans="${qObj.ans}">
                <div class="question-title">${qNum}. ${qObj.q}</div>
                <div class="options">${optionsHTML}</div>
            </div>
        `;
        formContainer.innerHTML += qHTML;
    });

    function checkScore() {
        let score = 0;
        let total = quizData.length;
        let incorrectSummary = "";
        
        let boxes = document.querySelectorAll('.question-box');
        
        boxes.forEach((box, index) => {
            let qNum = index + 1;
            let correctAns = box.getAttribute('data-correct-ans');
            let selectedInput = box.querySelector(`input[name="q${qNum}"]:checked`);
            
            let titleText = box.querySelector('.question-title').innerText;

            if (selectedInput) {
                let userAns = selectedInput.value;
                if (userAns === correctAns) {
                    score++;
                } else {
                    incorrectSummary += `<div class="summary-item"><strong>${titleText}</strong><br>❌ તમારો જવાબ: <span style="color:#c0392b;">${userAns}</span><br>✅ <b>સાચો જવાબ:</b> <span style="color:#27ae60;">${correctAns}</span></div>`;
                }
            } else {
                incorrectSummary += `<div class="summary-item"><strong>${titleText}</strong><br>❌ તમે જવાબ આપ્યો નથી.<br>✅ <b>સાચો જવાબ:</b> <span style="color:#27ae60;">${correctAns}</span></div>`;
            }
        });

        let resBox = document.getElementById('result-box');
        resBox.style.display = 'block';
        
        let htmlContent = `🎉 <b>અભિનંદન! તમારો સ્કોર: ${score} / ${total} સાચા પડ્યા છે!</b>`;
        
        if (score < total) {
            htmlContent += `<hr style="margin: 15px 0; border: 0; border-top: 1px solid #b2dfdb;"><b style="color: #c0392b;">💡 તમારા ખોટા પડેલા પ્રશ્નોના સાચા જવાબો અહીં તપાસો:</b>` + incorrectSummary;
        } else {
            htmlContent += `<br><br>🌟 અતિ ઉત્તમ! તમારી તૈયારી ખૂબ જ મજબૂત છે. પરીક્ષા માટે ઓલ ધ બેસ્ટ!`;
        }
        
        resBox.innerHTML = htmlContent;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
